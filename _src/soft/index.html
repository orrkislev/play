<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Relative ./assets paths need the trailing slash; not every server adds it.
      if (!location.pathname.endsWith('/') && !location.pathname.endsWith('.html'))
        location.replace(location.pathname + '/' + location.search + location.hash);
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='white'/><g fill='none' stroke='black' stroke-width='1.8' stroke-linecap='round'><path d='M4 10C11 4 19 15 28 8'/><path d='M4 17C12 11 19 22 28 15'/><path d='M4 24C11 18 20 29 28 22'/></g></svg>" />
    <title>soft</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #fff;
        overflow: hidden;
      }
      canvas {
        display: block;
      }
      #msg {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
        font: 15px/1.5 system-ui, sans-serif;
        color: #888;
      }
      .loading::after {
        content: '…';
        display: inline-block;
        overflow: hidden;
        vertical-align: bottom;
        width: 0;
        animation: dots 1.2s steps(4) infinite;
      }
      @keyframes dots {
        to {
          width: 1.25em;
        }
      }
      #msg[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="msg"><span class="loading">loading</span></div>
    <script type="module" src="./src/square.ts"></script>
  </body>
</html>
