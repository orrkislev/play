<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play · Orr Kislev</title>
<style>
  :root { color-scheme: light; }
  body { margin:0; background:#fcfbf8; color:#1a1a1a; font:17px/1.6 "Iowan Old Style", Georgia, serif; }
  main { max-width:1100px; margin:0 auto; padding:56px clamp(20px, 5vw, 56px) 80px; }
  h1 { margin:0 0 8px; font-weight:400; font-size:clamp(30px, 4.2vw, 48px); letter-spacing:-.02em; }
  header p { margin:0 0 40px; color:#6f6d66; }
  a { color:inherit; }
  header a { text-decoration:none; border-bottom:1px solid #cfcdc6; }
  #grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:20px; }
  .card { display:block; text-decoration:none; border:1px solid #e4e2db; border-radius:12px; overflow:hidden; transition:transform .2s, border-color .2s; }
  .card:hover { transform:translateY(-3px); border-color:#1a1a1a; }
  .card img { display:block; width:100%; aspect-ratio:4/3; object-fit:cover; background:#efede6; }
  .card .t { padding:14px 16px 16px; }
  .card b { display:block; font-weight:600; }
  .card span { color:#6f6d66; font-size:15px; }
  .empty { aspect-ratio:4/3; background:#efede6; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Play</h1>
    <p>Sketches and explorations. <a href="https://orrkislev.work">Orr Kislev</a> · <a href="https://creativecoding.orrkislev.work">Creative Coding</a></p>
  </header>
  <div id="grid"></div>
</main>
<script>
fetch('sketches.json').then(r => r.json()).then(list => {
  list.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  document.getElementById('grid').innerHTML = list.map(s =>
    `<a class="card" href="${s.id}/">${s.thumb ? `<img src="${s.id}/${s.thumb}" alt="" loading="lazy">` : '<div class="empty"></div>'}` +
    `<div class="t"><b>${s.name}</b><span>${s.description || ''}</span></div></a>`).join('');
});
</script>
</body>
</html>
